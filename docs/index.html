<!doctype html>
<html lang="tr" data-tema="acik">
<head>
<meta charset="utf-8">
<title>İlerleme</title>
<style>
  /* ============================================================
     TASARIM YÖNÜ: matbaa / defter.
     Bilerek YOK: yuvarlak kart, yumuşak gölge, gradyan bar,
     minik büyük-harf etiket üçlüsü, hap butonlar, konfeti.
     Bilerek VAR: serif dizgi, saç teli çizgiler, noktalı dolgu
     (matbaa içindekiler sayfası gibi), ilerlemenin kare kare
     haritası, tek vurgu rengi.
     ============================================================ */
  :root, [data-tema="acik"]{
    --kagit:#f2efe7; --panel:#eae6dc; --murekkep:#1a1916; --soluk:#7d786d;
    --cizgi:#d5cdbc; --ince:#e2dbcc; --dolu-bos:#dcd5c4;
    --sil:#a8321f; --secim:#e4dcc8;
    --serif:"Constantia","Cambria",Georgia,"Palatino Linotype","Book Antiqua",serif;
    --sans:"Segoe UI",-apple-system,system-ui,sans-serif;
    --mono:"Cascadia Mono",Consolas,"Courier New",monospace;
    --govde:var(--serif); --olcu:var(--serif);
    --kare:2px;
  }
  [data-tema="koyu"]{
    --kagit:#131316; --panel:#0e0e11; --murekkep:#e9e6df; --soluk:#8b877e;
    --cizgi:#2e2f34; --ince:#232429; --dolu-bos:#2b2c31;
    --sil:#e06c5a; --secim:#2a2b31;
  }
  [data-tema="siber"]{
    --kagit:#070a08; --panel:#0a0e0b; --murekkep:#c6dcc6; --soluk:#5d7a61;
    --cizgi:#1d2e20; --ince:#152018; --dolu-bos:#18261a;
    --sil:#e06c5a; --secim:#14231a;
    --govde:var(--mono); --olcu:var(--mono);
    --mobilya:#35d94f;
    --kare:0px;
  }

  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:var(--kagit); color:var(--murekkep);
    font:15.5px/1.6 var(--govde);
    display:flex; overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
  textarea{font:inherit; color:inherit}
  ::selection{background:var(--secim)}
  [data-tema="siber"] body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:99;
    background:repeating-linear-gradient(180deg,rgba(53,217,79,.028) 0 1px,transparent 1px 3px);
  }

  /* ===================== SOL: içindekiler ===================== */
  aside{
    width:280px; flex:0 0 280px; height:100vh; background:var(--panel);
    border-right:1px solid var(--cizgi); display:flex; flex-direction:column;
  }
  .marka{padding:30px 26px 4px}
  .marka h1{font-family:var(--serif); font-size:23px; font-weight:400; letter-spacing:.005em; font-style:italic}
  [data-tema="siber"] .marka h1{font-family:var(--mono); font-style:normal; font-size:16px; letter-spacing:.04em}
  [data-tema="siber"] .marka h1::after{content:"_"; color:var(--vurgu); animation:imlec 1.1s step-end infinite}
  @keyframes imlec{50%{opacity:0}}
  .marka p{font-size:12.5px; color:var(--soluk); margin-top:1px; font-style:italic}
  [data-tema="siber"] .marka p{font-style:normal; font-size:11.5px}

  .kural{height:1px; background:var(--cizgi); margin:18px 26px 4px}
  .tahtalar{flex:1; overflow-y:auto; padding:10px 26px 6px}
  .tahtalar::-webkit-scrollbar{width:6px}
  .tahtalar::-webkit-scrollbar-thumb{background:var(--cizgi)}

  /* içindekiler satırı: ad ....... 38  (noktalı dolgu) */
  .th{
    width:100%; display:flex; align-items:baseline; gap:7px; padding:7px 0;
    text-align:left; color:var(--soluk); transition:color .13s;
  }
  .th:hover{color:var(--murekkep)}
  .th-im{
    width:8px; height:8px; flex:0 0 8px; border:1px solid currentColor;
    border-radius:var(--kare); margin-bottom:1px; opacity:.55;
  }
  .th.aktif{color:var(--murekkep)}
  .th.aktif .th-im{background:var(--vurgu-satir); border-color:var(--vurgu-satir); opacity:1}
  .th-ad{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:0 1 auto; min-width:0}
  .th.aktif .th-ad{font-weight:600}
  .th-nokta{flex:1 1 auto; min-width:14px; border-bottom:1px dotted var(--cizgi); transform:translateY(-4px)}
  .th-yuzde{font-family:var(--olcu); font-size:13px; font-variant-numeric:tabular-nums; letter-spacing:.02em}

  .alt-islem{padding:14px 26px 6px}
  .alt-islem button{font-size:13.5px; color:var(--soluk); font-style:italic; transition:color .13s}
  [data-tema="siber"] .alt-islem button{font-style:normal; font-size:12.5px}
  .alt-islem button:hover{color:var(--murekkep)}

  .temalar{display:flex; gap:14px; padding:10px 26px 24px}
  .temalar button{font-size:12.5px; color:var(--soluk); padding-bottom:2px; transition:.13s}
  .temalar button:hover{color:var(--murekkep)}
  .temalar button.secili{color:var(--murekkep); border-bottom:1px solid var(--murekkep)}

  /* ===================== SAĞ: sayfa ===================== */
  main{flex:1; height:100vh; overflow-y:auto; padding:52px 60px 110px}
  main::-webkit-scrollbar{width:8px}
  main::-webkit-scrollbar-thumb{background:var(--cizgi)}
  .sar{max-width:820px}

  .bos{display:flex; height:calc(100vh - 162px); align-items:center}
  .bos h2{font-family:var(--serif); font-size:34px; font-weight:400; font-style:italic; margin-bottom:10px}
  [data-tema="siber"] .bos h2{font-family:var(--mono); font-style:normal; font-size:22px}
  .bos p{color:var(--soluk); max-width:44ch}

  .tepe{display:flex; align-items:flex-start; gap:20px}
  h2.ad{
    font-family:var(--serif); font-size:52px; font-weight:400; letter-spacing:-.02em;
    line-height:1.04; flex:1; outline:0; padding:0; border:0; background:none;
  }
  [data-tema="siber"] h2.ad{font-family:var(--mono); font-size:30px; letter-spacing:0; line-height:1.2}
  h2.ad:focus{box-shadow:0 2px 0 var(--vurgu)}
  .sil-tahta{color:var(--soluk); font-size:12.5px; font-style:italic; flex:0 0 auto; margin-top:16px; transition:color .13s}
  [data-tema="siber"] .sil-tahta{font-style:normal; font-size:11.5px}
  .sil-tahta:hover{color:var(--sil)}

  hr{border:0; height:1px; background:var(--cizgi); margin:26px 0 0}
  hr.ince{background:var(--ince)}

  /* ---- ölçüm: solda dev rakam, sağda kare kare harita ---- */
  .olcum{display:flex; gap:44px; align-items:flex-start; padding:30px 0 28px}
  .rakam{flex:0 0 auto; line-height:.82}
  .rakam b{
    font-family:var(--serif); font-size:112px; font-weight:400; letter-spacing:-.05em;
    font-variant-numeric:tabular-nums; color:var(--vurgu); display:inline-block;
  }
  [data-tema="siber"] .rakam b{font-family:var(--mono); font-size:76px; letter-spacing:-.02em}
  .rakam i{font-family:var(--serif); font-style:normal; font-size:34px; color:var(--vurgu); vertical-align:super; margin-left:2px}
  [data-tema="siber"] .rakam i{font-family:var(--mono); font-size:24px}
  .rakam p{font-size:13px; color:var(--soluk); font-style:italic; margin-top:14px; line-height:1.5}
  [data-tema="siber"] .rakam p{font-style:normal; font-size:12px}

  .harita{flex:1; padding-top:10px}
  .kareler{display:flex; flex-wrap:wrap; gap:5px}
  .kareler span{
    width:15px; height:15px; border:1px solid var(--dolu-bos); border-radius:var(--kare);
    transition:background .2s, border-color .2s;
  }
  .kareler span.dolu{background:var(--vurgu); border-color:var(--vurgu)}
  .kareler.dalga span.dolu{animation:dalga .5s ease-out both}
  @keyframes dalga{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
  .cizgi-olcum{height:14px; background:var(--dolu-bos); border-radius:var(--kare); overflow:hidden}
  .cizgi-olcum i{display:block; height:100%; width:0; background:var(--vurgu); transition:width .6s cubic-bezier(.2,.75,.2,1)}
  .kunye{margin-top:16px; font-size:13px; color:var(--soluk); font-variant-numeric:tabular-nums}
  .kunye em{font-style:italic; color:var(--murekkep)}
  [data-tema="siber"] .kunye em{font-style:normal; color:var(--vurgu)}
  .kunye .sogumus{color:#b07b1e}
  [data-tema="siber"] .kunye .sogumus{color:#d9a441}

  /* ---- renk: küçük kareler, etiketsiz ---- */
  .renkler{display:flex; gap:6px; margin:22px 0 0; opacity:.55; transition:opacity .18s}
  .renkler:hover{opacity:1}
  .renkler button{width:13px; height:13px; border-radius:var(--kare); opacity:.42; transition:opacity .13s, transform .13s}
  .renkler button:hover{opacity:.85; transform:scale(1.2)}
  .renkler button.secili{opacity:1; transform:scale(1.15); box-shadow:0 0 0 1px var(--kagit),0 0 0 2px var(--murekkep)}

  /* ---- liste: defter satırları ---- */
  ol{list-style:none; margin:30px 0 0; border-top:1px solid var(--ince)}
  li{
    display:flex; align-items:baseline; gap:11px; padding:12px 2px;
    border-bottom:1px solid var(--ince); cursor:pointer; transition:background .12s;
  }
  li:hover{background:var(--secim)}
  /* Sıra no + HER ZAMAN görünen kare.
     Önce kare yalnızca üstüne gelince beliriyordu; Berk ilk seferde
     anlamadı, deneyerek buldu (2026-09-11). Gizli olan keşfedilmiyor. */
  .no{
    flex:0 0 20px; text-align:right; align-self:center;
    font-family:var(--olcu); font-size:11.5px; color:var(--soluk);
    font-variant-numeric:tabular-nums;
  }
  .im{
    flex:0 0 15px; width:15px; height:15px; align-self:center;
    border:1px solid var(--cizgi); border-radius:var(--kare);
    transition:background .16s, border-color .16s;
  }
  li:hover .im{border-color:var(--soluk)}
  li.ok .im{background:var(--vurgu); border-color:var(--vurgu)}
  li.ok .no{color:var(--dolu-bos)}
  .metin{flex:1; transition:color .16s}
  li.ok .metin{color:var(--soluk); text-decoration:line-through; text-decoration-thickness:1px; text-decoration-color:var(--cizgi)}
  .tarih{
    font-family:var(--olcu); font-size:11.5px; color:var(--soluk);
    font-variant-numeric:tabular-nums; letter-spacing:.01em; flex:0 0 auto;
  }
  li.ayrac{
    cursor:default; border-bottom:0; padding:26px 2px 8px; color:var(--soluk);
    font-size:12.5px; font-style:italic; gap:10px; align-items:center;
  }
  [data-tema="siber"] li.ayrac{font-style:normal; font-size:11.5px}
  li.ayrac:hover{background:none}
  li.ayrac i{flex:1; height:1px; background:var(--ince); font-style:normal}
  .sil{opacity:0; color:var(--soluk); font-size:15px; padding:0 6px; transition:.12s}
  li:hover .sil{opacity:.6}
  .sil:hover{opacity:1; color:var(--sil)}
  ol.giris li{animation:gir .3s ease-out both}
  @keyframes gir{from{opacity:0}to{opacity:1}}

  /* ---- ekleme: çizgi üstünde yazı, kutu yok ---- */
  .ekle{margin-top:30px}
  textarea{
    width:100%; min-height:30px; resize:vertical; padding:6px 0 10px;
    border:0; border-bottom:1px solid var(--cizgi); background:none; outline:0;
    font-size:15.5px; font-family:var(--govde);
  }
  [data-tema="siber"] textarea{font-size:14px}
  textarea::placeholder{color:var(--soluk); font-style:italic}
  [data-tema="siber"] textarea::placeholder{font-style:normal}
  textarea:focus{border-bottom-color:var(--vurgu)}
  .ekle-alt{display:flex; align-items:center; gap:16px; margin-top:12px}
  .btn{
    font-family:var(--olcu); font-size:13px; letter-spacing:.02em; padding:7px 0;
    border-bottom:1px solid var(--murekkep); transition:.13s;
  }
  [data-tema="siber"] .btn{letter-spacing:.08em}
  .btn:hover{color:var(--vurgu); border-bottom-color:var(--vurgu)}
  .ipucu{font-size:12.5px; color:var(--soluk); font-style:italic}
  [data-tema="siber"] .ipucu{font-style:normal; font-size:11.5px}

  /* siber: arayüz mobilyası fosfor yeşili — tahta rengi ilerlemeye ayrılıyor */
  [data-tema="siber"] .marka h1::after{color:var(--mobilya)}
  [data-tema="siber"] .kunye::before{content:"> "; color:var(--mobilya)}
  [data-tema="siber"] .kunye em{color:var(--mobilya)}
  [data-tema="siber"] .btn{color:var(--mobilya); border-bottom-color:var(--mobilya)}
  [data-tema="siber"] .btn:hover{opacity:.75}
  [data-tema="siber"] textarea:focus{border-bottom-color:var(--mobilya)}
  [data-tema="siber"] .temalar button.secili{color:var(--mobilya); border-bottom-color:var(--mobilya)}
  [data-tema="siber"] h2.ad:focus{box-shadow:0 2px 0 var(--mobilya)}
  [data-tema="siber"] .th{font-size:13px}
  [data-tema="siber"] .th-yuzde{font-size:12px}

  /* ---- bitirme mührü: gerçek ıstampa gibi basılır ----
     Kartvizit değil MÜREKKEP: arkasında zemin yok, kağıda karışıyor
     (multiply / koyuda screen), mürekkep düzensiz — bazı yerleri basmıyor,
     iniş anında sayfa bir sarsılıyor, her seferinde açısı biraz farklı. */
  .muhur-perde{
    position:fixed; inset:0; z-index:100; pointer-events:none;
    display:grid; place-items:center; animation:perde 2.9s forwards;
  }
  @keyframes perde{0%,66%{opacity:1}100%{opacity:0}}
  .muhur{
    position:relative; color:var(--vurgu); border:3px double currentColor;
    border-radius:var(--kare); padding:15px 30px 17px; text-align:center;
    opacity:0; transform:rotate(var(--don)) scale(1.03);
    animation:basma .3s ease-out .42s forwards;
    mix-blend-mode:multiply; filter:saturate(1.15);
  }
  [data-tema="koyu"] .muhur,[data-tema="siber"] .muhur{mix-blend-mode:screen}
  @keyframes basma{   /* mürekkep, damga kağıda değdiği anda beliriyor */
    0%{transform:rotate(var(--don)) scale(1.035); opacity:0}
    45%{opacity:1}
    100%{transform:rotate(var(--don)) scale(1); opacity:1}
  }

  /* ---- ahşap saplı damga: yukarıdan iner, bastırır, kalkar ---- */
  .damga{
    position:absolute; left:50%; top:50%; width:132px; margin-left:-66px;
    transform-origin:50% 100%; opacity:0; filter:drop-shadow(0 14px 18px rgba(0,0,0,.32));
    animation:indir 1.15s cubic-bezier(.45,0,.3,1) forwards;
  }
  .damga svg{display:block; width:100%; height:auto}
  @keyframes indir{   /* sağ alt çaprazdan gelir, basar, aynı yönden çekilir */
    0%  {transform:translateY(-100%) translate(360px,330px) rotate(26deg); opacity:0}
    14% {opacity:1}
    38% {transform:translateY(-100%) translate(0,-2px) rotate(var(--don)); opacity:1}
    48% {transform:translateY(-100%) translate(0,6px) rotate(var(--don))}
    60% {transform:translateY(-100%) translate(0,-1px) rotate(var(--don))}
    74% {opacity:1}
    100%{transform:translateY(-100%) translate(380px,350px) rotate(24deg); opacity:0}
  }

  /* mürekkebin basmadığı yerler: kağıt renginde lekeler */
  .muhur::after{
    content:""; position:absolute; inset:-3px; pointer-events:none; opacity:.62;
    background:
      radial-gradient(circle at 9% 26%, var(--kagit) 0 6px, transparent 7px),
      radial-gradient(circle at 31% 8%, var(--kagit) 0 4px, transparent 5px),
      radial-gradient(circle at 62% 91%, var(--kagit) 0 7px, transparent 8px),
      radial-gradient(circle at 88% 34%, var(--kagit) 0 5px, transparent 6px),
      radial-gradient(circle at 47% 52%, var(--kagit) 0 3px, transparent 4px),
      radial-gradient(circle at 76% 12%, var(--kagit) 0 3px, transparent 4px),
      radial-gradient(circle at 18% 78%, var(--kagit) 0 4px, transparent 5px),
      repeating-linear-gradient(28deg, transparent 0 5px, rgba(255,255,255,.16) 5px 6px);
  }
  .muhur b{
    display:block; font-family:var(--serif); font-size:34px; font-weight:400;
    letter-spacing:.16em; text-transform:uppercase; line-height:1;
  }
  [data-tema="siber"] .muhur b{font-family:var(--mono); font-size:24px; letter-spacing:.12em}
  .muhur span{display:block; margin-top:9px; font-family:var(--olcu); font-size:12px; letter-spacing:.1em; opacity:.8}
  .muhur em{display:block; margin-bottom:9px; font-size:11px; letter-spacing:.22em; opacity:.65; font-style:normal}

  /* iniş anında sayfa sarsıntısı */
  @keyframes sars{
    0%,100%{transform:translate(0,0)}
    20%{transform:translate(2px,-2px)} 40%{transform:translate(-2px,1px)}
    60%{transform:translate(1px,2px)}  80%{transform:translate(-1px,-1px)}
  }
  body.sarsinti aside, body.sarsinti main{animation:sars .19s ease-in-out}

  /* ---- kağıt dokusu: yalnız açık temada, çok hafif ---- */
  [data-tema="acik"] body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:1; opacity:.5;
    background-image:radial-gradient(circle at 1px 1px, rgba(120,100,70,.055) 1px, transparent 0);
    background-size:4px 4px;
  }
  aside,main{position:relative; z-index:2}
  .kareler span{cursor:default}
</style>
</head>
<body>
<aside>
  <div class="marka">
    <h1 id="marka">İlerleme</h1>
    <p id="altyazi">aç, tik at, kapat</p>
  </div>
  <div class="kural"></div>
  <div class="tahtalar" id="liste"></div>
  <div class="alt-islem"><button id="yeniTahta">+ yeni tahta</button></div>
  <div class="temalar" id="temalar"></div>
</aside>
<main id="ana"></main>

<script>
const RENKLER = ["#b3341f","#c2601c","#b8912a","#3f7d4e","#2c5f86","#5a4b8c","#98366b","#2e2b26"];
const TEMALAR = [["acik","açık"],["koyu","koyu"],["siber","siber"]];
let D = {tahtalar:[], aktif:null, tema:"acik"};
let yaziyor = false, kirli = false;
let sonCizilen = null, gosterilen = 0, dalgaBir = false;

const kacGun = iso => {
  if(!iso) return null;
  const a = new Date(iso + "T00:00:00"), b = new Date(new Date().toDateString());
  return Math.round((b - a) / 86400000);
};
const bugun = () => {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
};
const kimlik = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const siber = () => D.tema === "siber";
const kacar = n => String(n);

let yerel = false;   /* sunucu yoksa (Pages demosu) tarayıcı hafızası */
async function yukle(){
  try{
    D = await (await fetch("/api/veri")).json();
  }catch(e){
    yerel = true;
    try{ D = JSON.parse(localStorage.getItem("ilerleme") || "null") || {tahtalar:[],aktif:null,tema:"acik"}; }
    catch(_){ D = {tahtalar:[],aktif:null,tema:"acik"}; }
  }
  if(!D.tahtalar) D.tahtalar = [];
  if(!D.tema) D.tema = "acik";
  if(!D.aktif && D.tahtalar.length) D.aktif = D.tahtalar[0].id;
  temaUygula();
  ciz();
}
/* Kaydetme GECİKMESİZ. Önce 250 ms bekletiliyordu ve pencere o arada
   kapanırsa son değişiklik uçuyordu (test'te bir tahta böyle kaybedildi). */
function kaydet(){
  if(yerel){ try{ localStorage.setItem("ilerleme", JSON.stringify(D)); }catch(e){} return; }
  if(yaziyor){ kirli = true; return; }
  yaziyor = true;
  fetch("/api/veri", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify(D), keepalive:true
  }).catch(()=>{}).then(() => {
    yaziyor = false;
    if(kirli){ kirli = false; kaydet(); }
  });
}
addEventListener("pagehide", () => {
  try{ navigator.sendBeacon("/api/veri", new Blob([JSON.stringify(D)], {type:"application/json"})); }catch(e){}
});
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "hidden") kaydet();
});

const aktifTahta = () => D.tahtalar.find(t => t.id === D.aktif);
const oran = t => t.maddeler.length ? t.maddeler.filter(m => m.bitti).length / t.maddeler.length : 0;

function temaUygula(){
  document.documentElement.dataset.tema = D.tema;
  document.getElementById("marka").textContent = siber() ? "berk@ilerleme" : "İlerleme";
  document.getElementById("altyazi").textContent = siber() ? "~/hedefler" : "aç, tik at, kapat";
  const k = document.getElementById("temalar");
  k.innerHTML = "";
  TEMALAR.forEach(([id, ad]) => {
    const b = document.createElement("button");
    b.textContent = ad;
    if(D.tema === id) b.className = "secili";
    b.onclick = () => { D.tema = id; kaydet(); temaUygula(); ciz(); };
    k.appendChild(b);
  });
}

/* bitirme mührü — sayfanın ortasına basılır, 2.6 sn'de solar */
function muhurBas(t){
  const d = new Date();
  const tarih = String(d.getDate()).padStart(2,"0") + "." + String(d.getMonth()+1).padStart(2,"0") + "." + d.getFullYear();
  const k = document.createElement("div");
  k.className = "muhur-perde";
  k.style.setProperty("--vurgu", t.renk);
  const aci = -13 + Math.random() * 9;                 /* her basışta biraz farklı */
  k.style.setProperty("--don", aci.toFixed(2) + "deg");
  k.style.setProperty("--don2", (aci - 7).toFixed(2) + "deg");
  const ic = document.createElement("div");
  ic.className = "muhur";
  ic.innerHTML = '<em>' + (siber() ? "[ GOREV ]" : "İlerleme") + '</em>' +
                 '<b>' + (siber() ? "TAMAMLANDI" : "Tamamlandı") + '</b>' +
                 '<span></span>';
  ic.querySelector("span").textContent = t.maddeler.length + " madde · " + tarih;
  const dmg = document.createElement("div");
  dmg.className = "damga";
  dmg.innerHTML =
    '<svg viewBox="0 0 132 168" xmlns="http://www.w3.org/2000/svg">' +
      '<defs>' +
        '<linearGradient id="ah" x1="0" y1="0" x2="1" y2="0">' +
          '<stop offset="0" stop-color="#8a5220"/><stop offset=".34" stop-color="#d59a58"/>' +
          '<stop offset=".62" stop-color="#b5763a"/><stop offset="1" stop-color="#6f3f18"/>' +
        '</linearGradient>' +
        '<linearGradient id="ah2" x1="0" y1="0" x2="1" y2="0">' +
          '<stop offset="0" stop-color="#7b481c"/><stop offset=".38" stop-color="#c98a4b"/>' +
          '<stop offset="1" stop-color="#5f3614"/>' +
        '</linearGradient>' +
      '</defs>' +
      '<ellipse cx="66" cy="30" rx="31" ry="27" fill="url(#ah)"/>' +
      '<path d="M52 48 q14 10 28 0 l7 34 q-21 9 -42 0 z" fill="url(#ah2)"/>' +
      '<rect x="55" y="80" width="22" height="26" rx="4" fill="url(#ah)"/>' +
      '<path d="M30 108 q36 -12 72 0 l6 30 q-42 12 -84 0 z" fill="url(#ah2)"/>' +
      '<rect x="22" y="136" width="88" height="12" rx="5" fill="#4a2a10"/>' +
      '<ellipse cx="66" cy="152" rx="46" ry="11" fill="#241c1a"/>' +
      '<ellipse cx="66" cy="150" rx="44" ry="9" fill="#37302d"/>' +
    '</svg>';
  k.appendChild(dmg);
  k.appendChild(ic);
  document.body.appendChild(k);
  setTimeout(() => {                                    /* mühür kağıda değdiği an */
    document.body.classList.add("sarsinti");
    setTimeout(() => document.body.classList.remove("sarsinti"), 230);
  }, 430);
  setTimeout(() => k.remove(), 3000);
}

/* dev rakam yerinde sayıyor */
function sayacOynat(el, hedef){
  const bas = gosterilen, fark = hedef - bas, t0 = performance.now(), sure = 520;
  if(fark === 0){ el.textContent = hedef; return; }
  const adim = z => {
    const p = Math.min((z - t0) / sure, 1);
    el.textContent = Math.round(bas + fark * (1 - Math.pow(1 - p, 3)));
    if(p < 1) requestAnimationFrame(adim); else gosterilen = hedef;
  };
  requestAnimationFrame(adim);
}

/* ---------- sol: içindekiler ---------- */
function cizListe(){
  const l = document.getElementById("liste");
  l.innerHTML = "";
  D.tahtalar.forEach(t => {
    const b = document.createElement("button");
    b.className = "th" + (t.id === D.aktif ? " aktif" : "");
    b.style.setProperty("--vurgu-satir", t.renk);
    b.innerHTML = '<span class="th-im"></span><span class="th-ad"></span>' +
      '<span class="th-nokta"></span><span class="th-yuzde">' + Math.round(oran(t)*100) + '</span>';
    b.querySelector(".th-ad").textContent = t.ad;
    b.onclick = () => { D.aktif = t.id; kaydet(); ciz(); };
    l.appendChild(b);
  });
}

/* ---------- sağ: sayfa ---------- */
function ciz(){
  cizListe();
  const ana = document.getElementById("ana"), t = aktifTahta();
  if(!t){
    document.documentElement.style.setProperty("--vurgu", "#7d786d");
    ana.innerHTML = '<div class="bos"><div>' +
      '<h2>Boş sayfa</h2>' +
      '<p>Soldan <b>+ yeni tahta</b> ile bir kurs, kitap, proje aç. ' +
      'Ders listesini olduğu gibi kopyalayıp yapıştır — her satır ayrı madde olur.</p>' +
      '</div></div>';
    return;
  }
  document.documentElement.style.setProperty("--vurgu", t.renk);

  const biten = t.maddeler.filter(m => m.bitti).length, top = t.maddeler.length;
  const yuzde = Math.round(oran(t) * 100);
  const g = kacGun(t.son_dokunma);
  const sogumus = g !== null && g >= 14;
  const bugunBiten = t.maddeler.filter(m => m.bitti && m.bitis === bugun()).length;
  const yeni = sonCizilen !== t.id;
  if(yeni) gosterilen = 0;

  /* künye: üç kutu yerine tek satır dizgi */
  const parcalar = [];
  parcalar.push("<em>" + top + "</em> madde");
  parcalar.push("<em>" + biten + "</em> bitti");
  if(bugunBiten) parcalar.push("bugün <em>" + bugunBiten + "</em>");
  parcalar.push(
    top === 0 ? "boş"
    : g === null ? "hiç dokunulmadı"
    : g === 0 ? "bugün dokundun"
    : g === 1 ? "dün dokundun"
    : '<span class="' + (sogumus ? "sogumus" : "") + '">' + g + " gün önce dokundun" + (sogumus ? ", soğumuş" : "") + "</span>"
  );

  /* 80 maddeye kadar kare kare harita, üstünde tek çizgi */
  const haritaHtml = top === 0 ? ""
    : top <= 80
      ? '<div class="kareler' + (dalgaBir ? " dalga" : "") + '" id="kareler">' +
        t.maddeler.map((m,i) => '<span class="' + (m.bitti ? "dolu" : "") + '" style="animation-delay:' + (i*16) + 'ms" title="' + (i+1) + '. ' + m.metin.replace(/"/g,"&quot;") + '"></span>').join("") +
        '</div>'
      : '<div class="cizgi-olcum"><i id="dolgu"></i></div>';

  ana.innerHTML = '<div class="sar">' +
    '<div class="tepe">' +
      '<h2 class="ad" contenteditable spellcheck="false" id="ad"></h2>' +
      '<button class="sil-tahta" id="silTahta">tahtayı sil</button>' +
    '</div>' +
    '<hr>' +
    '<div class="olcum">' +
      '<div class="rakam"><b id="yuzde">0</b><i>%</i>' +
        '<p>' + (top ? biten + " / " + top : "henüz madde yok") + '</p>' +
      '</div>' +
      '<div class="harita">' + haritaHtml +
        '<p class="kunye">' + parcalar.join(" &nbsp;·&nbsp; ") + '</p>' +
        '<div class="renkler" id="renkler"></div>' +
      '</div>' +
    '</div>' +
    '<ol id="maddeler" class="' + (yeni ? "giris" : "") + '"></ol>' +
    '<div class="ekle">' +
      '<textarea id="giris" placeholder="Yeni madde… (ders listesini alt alta yapıştırabilirsin)"></textarea>' +
      '<div class="ekle-alt"><button class="btn" id="ekleBtn">' + (siber() ? "EKLE" : "Ekle") + '</button>' +
      '<span class="ipucu">Enter ekler · Shift+Enter alt satır</span></div>' +
    '</div></div>';

  sonCizilen = t.id;
  dalgaBir = false;

  const ad = document.getElementById("ad");
  ad.textContent = t.ad;
  ad.onblur = () => { t.ad = (ad.textContent.trim() || "Adsız"); ad.textContent = t.ad; kaydet(); cizListe(); };
  ad.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); ad.blur(); } };

  document.getElementById("silTahta").onclick = () => {
    if(!confirm('"' + t.ad + '" tahtası ve ' + top + ' maddesi silinecek. Emin misin?')) return;
    D.tahtalar = D.tahtalar.filter(x => x.id !== t.id);
    D.aktif = D.tahtalar.length ? D.tahtalar[0].id : null;
    sonCizilen = null; kaydet(); ciz();
  };

  const rk = document.getElementById("renkler");
  RENKLER.forEach(r => {
    const b = document.createElement("button");
    b.style.background = r;
    if(r === t.renk) b.className = "secili";
    b.onclick = () => { t.renk = r; kaydet(); ciz(); };
    rk.appendChild(b);
  });

  const ol = document.getElementById("maddeler");
  const gunFmt = iso => {
    if(!iso) return "";
    const [y,a,g] = iso.split("-");
    return g + "." + a + "." + y;
  };
  const satirYap = (m, i) => {
    const li = document.createElement("li");
    li.className = m.bitti ? "ok" : "";
    li.style.animationDelay = Math.min(i * 18, 360) + "ms";
    li.innerHTML = '<span class="no">' + kacar(i+1) + '</span><span class="im"></span>' +
      '<span class="metin"></span>' +
      (m.bitti && m.bitis ? '<span class="tarih">' + gunFmt(m.bitis) + '</span>' : '') +
      '<button class="sil" title="sil">×</button>';
    li.querySelector(".metin").textContent = m.metin;
    li.onclick = e => {
      if(e.target.closest(".sil")) return;
      const oncekiHepsi = top > 0 && biten === top;
      m.bitti = !m.bitti;
      m.bitis = m.bitti ? bugun() : null;
      t.son_dokunma = bugun();
      const simdiHepsi = t.maddeler.length > 0 && t.maddeler.every(x => x.bitti);
      const kutla = simdiHepsi && !oncekiHepsi;
      dalgaBir = kutla;                        /* kareler sırayla dalgalanır */
      kaydet(); ciz();
      if(kutla) muhurBas(t);
    };
    li.querySelector(".sil").onclick = () => {
      t.maddeler = t.maddeler.filter(x => x.id !== m.id);
      kaydet(); ciz();
    };
    return li;
  };

  /* Bitenler listenin ALTINA düşer, en son bitirilen en üstte.
     Sıra numarası orijinal sırayı koruyor — madde nereden geldi belli olsun. */
  const acikOlan = [], bitmis = [];
  t.maddeler.forEach((m, i) => (m.bitti ? bitmis : acikOlan).push([m, i]));
  bitmis.sort((a, b) => String(b[0].bitis || "").localeCompare(String(a[0].bitis || "")));
  acikOlan.forEach(([m, i]) => ol.appendChild(satirYap(m, i)));
  if(bitmis.length){
    const ay = document.createElement("li");
    ay.className = "ayrac";
    ay.innerHTML = '<span></span><i></i>';
    ay.querySelector("span").textContent = (siber() ? "bitenler · " : "bitenler · ") + bitmis.length;
    ol.appendChild(ay);
    bitmis.forEach(([m, i]) => ol.appendChild(satirYap(m, i)));
  }

  const giris = document.getElementById("giris");
  const ekle = () => {
    const satirlar = giris.value.split("\n").map(s => s.trim()).filter(Boolean);
    if(!satirlar.length) return;
    satirlar.forEach(s => t.maddeler.push({id:kimlik(), metin:s, bitti:false, bitis:null}));
    if(!t.son_dokunma) t.son_dokunma = bugun();
    giris.value = "";
    kaydet(); ciz();
    const y = document.getElementById("giris"); if(y) y.focus();
  };
  document.getElementById("ekleBtn").onclick = ekle;
  giris.onkeydown = e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); ekle(); } };

  sayacOynat(document.getElementById("yuzde"), yuzde);
  const d = document.getElementById("dolgu");
  if(d) requestAnimationFrame(() => { d.style.width = yuzde + "%"; });
}

/* Yeni tahta: pencere açıp isim sormuyor — kurup başlığı düzenlemeye alıyor. */
document.getElementById("yeniTahta").onclick = () => {
  const t = {
    id:kimlik(), ad:"Yeni tahta", renk:RENKLER[D.tahtalar.length % RENKLER.length],
    olusturma:bugun(), son_dokunma:null, maddeler:[]
  };
  D.tahtalar.push(t); D.aktif = t.id; kaydet(); ciz();
  const ad = document.getElementById("ad");
  if(ad){
    ad.focus();
    const s = document.createRange(); s.selectNodeContents(ad);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(s);
  }
};
